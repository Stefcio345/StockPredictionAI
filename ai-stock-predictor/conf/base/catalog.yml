# Raw data from Yahoo Finance
stocks_history_raw_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/stocks_history_raw_data.csv
  save_args:
    index: False

stocks_information_raw_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/stocks_information_raw_data.csv
  save_args:
    index: False

stocks_information_cleaned:
  type: pandas.ParquetDataset
  filepath: data/02_cleaned/stocks_information_cleaned.parquet
  save_args:
    index: False
    compression: brotli

stocks_history_cleaned:
  type: pandas.ParquetDataset
  filepath: data/02_cleaned/stocks_history_cleaned.parquet
  save_args:
    index: False
    compression: brotli

stocks_data_merged:
  type: pandas.ParquetDataset
  filepath: data/03_merged/stocks_data_merged.parquet
  save_args:
    index: False
    compression: brotli

stocks_with_date:
  type: pandas.ParquetDataset
  filepath: data/04_feature_engineering/stocks_with_date.parquet
  save_args:
    index: False
    compression: brotli

stocks_with_company:
  type: pandas.ParquetDataset
  filepath: data/04_feature_engineering/stocks_with_company.parquet
  save_args:
    index: False
    compression: brotli

stocks_with_lags:
  type: pandas.ParquetDataset
  filepath: data/04_feature_engineering/stocks_with_lags.parquet
  save_args:
    index: False
    compression: brotli

stocks_with_corporate:
  type: pandas.ParquetDataset
  filepath: data/04_feature_engineering/stocks_with_corporate.parquet
  save_args:
    index: False
    compression: brotli

stocks_final:
  type: pandas.ParquetDataset
  filepath: data/04_feature_engineering/stocks_final.parquet
  save_args:
    index: False
    compression: brotli

model_input_table:
  type: pandas.ParquetDataset
  filepath: data/04_feature_engineering/stocks_final.parquet
  load_args:
    engine: auto

multi_target_models:
  type: pickle.PickleDataset
  filepath: data/05_models/multi_target_models.pkl

multi_target_metrics:
  type: yaml.YAMLDataset
  filepath: data/06_reports/multi_target_metrics.yaml

